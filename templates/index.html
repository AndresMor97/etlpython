<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ETL AS/400</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <h1 class="text-xl font-bold tracking-wider"><i class="fas fa-database mr-2 text-blue-400"></i> IBM ETL</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center px-4 py-3 bg-blue-600 rounded-lg text-white">
                <i class="fas fa-chart-pie mr-3"></i> Dashboard
            </a>
            <a href="/live" target="_blank" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition-colors">
                <i class="fas fa-heartbeat mr-3"></i> Live Checker
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700 text-sm text-slate-400 text-center">
            Sistema AS/400 Integrado
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Header -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
            <h2 class="text-2xl font-semibold text-gray-700">Resumen de Sucursales</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span> Sistema Online
                </span>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="p-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                            <i class="fas fa-building text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="mb-2 text-sm font-medium text-gray-500">Total Sucursales</p>
                            <p class="text-2xl font-bold text-gray-800" id="total-sucursales">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <div class="flex items-center">
                        <div class="p-3 rounded-full bg-green-100 text-green-600">
                            <i class="fas fa-dollar-sign text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="mb-2 text-sm font-medium text-gray-500">Monto Total Aprobado</p>
                            <p class="text-2xl font-bold text-gray-800" id="monto-total">$0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                    <div class="flex items-center w-full">
                        <div class="p-3 rounded-full bg-purple-100 text-purple-600">
                            <i class="fas fa-clock text-xl"></i>
                        </div>
                        <div class="ml-4 flex-1">
                            <div class="flex justify-between items-center mb-1">
                                <p class="text-sm font-medium text-gray-500">Última Actualización</p>
                                <select id="tz-select" class="text-xs bg-gray-50 border border-gray-200 rounded px-1 py-0.5 text-gray-600 focus:outline-none">
                                    <option value="-6">UTC -6 (México DF)</option>
                                    <option value="-5" selected>UTC -5 (Colombia/Perú)</option>
                                    <option value="-4">UTC -4 (Chile/Bolivia)</option>
                                    <option value="-3">UTC -3 (Argentina)</option>
                                    <option value="0">UTC +0 (Londres)</option>
                                    <option value="1">UTC +1 (Madrid)</option>
                                    <option value="2">UTC +2 (Atenas)</option>
                                </select>
                            </div>
                            <p class="text-lg font-bold text-gray-800" id="last-update">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Bar Chart -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-700 mb-4">Montos por Sucursal</h3>
                    <div class="relative h-72">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>

                <!-- Data Table -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-lg font-semibold text-gray-700 mb-4">Detalle de Transacciones</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sucursal</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Monto</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Filas generadas dinámicamente -->
                            </tbody>
                        </table>
                        <div id="no-data" class="text-center py-8 text-gray-500 hidden">
                            <i class="fas fa-inbox text-4xl mb-3 text-gray-300"></i>
                            <p>No hay datos disponibles. Ejecuta el proceso ETL.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const datos_etl = {{ datos | tojson }};
        const ultima_act = "{{ ultima_actualizacion }}";

        function updateTime() {
            if (!ultima_act) return;
            const dateUTC = new Date(ultima_act);
            
            if (isNaN(dateUTC)) {
                document.getElementById('last-update').innerText = ultima_act;
                return;
            }
            
            const offset = parseInt(document.getElementById('tz-select').value);
            const localDate = new Date(dateUTC.getTime() + offset * 3600 * 1000);
            
            const yyyy = localDate.getUTCFullYear();
            const mm = String(localDate.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(localDate.getUTCDate()).padStart(2, '0');
            const hh = String(localDate.getUTCHours()).padStart(2, '0');
            const min = String(localDate.getUTCMinutes()).padStart(2, '0');
            const ss = String(localDate.getUTCSeconds()).padStart(2, '0');
            
            const ampm = localDate.getUTCHours() >= 12 ? 'PM' : 'AM';
            const hh12 = String(localDate.getUTCHours() % 12 || 12).padStart(2, '0');
            
            document.getElementById('last-update').innerText = `${yyyy}-${mm}-${dd} ${hh12}:${min}:${ss} ${ampm}`;
        }

        document.getElementById('tz-select').addEventListener('change', updateTime);

        if (ultima_act) {
            updateTime();
        }

        if (datos_etl && datos_etl.length > 0) {
            document.getElementById('no-data').classList.add('hidden');
            
            const sucursales = datos_etl.map(d => d.SUCURSAL || 'Desconocida');
            const montos = datos_etl.map(d => parseFloat(d.MONTO) || 0);
            
            const totalMonto = montos.reduce((a, b) => a + b, 0);
            
            document.getElementById('total-sucursales').innerText = datos_etl.length;
            document.getElementById('monto-total').innerText = '$' + totalMonto.toLocaleString('es-CO');

            // Render Tabla
            const tableBody = document.getElementById('table-body');
            datos_etl.forEach(d => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                
                const tdSucursal = document.createElement('td');
                tdSucursal.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900';
                tdSucursal.innerText = d.SUCURSAL || 'Desconocida';
                
                const tdMonto = document.createElement('td');
                tdMonto.className = 'px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-right';
                tdMonto.innerText = '$' + (parseFloat(d.MONTO) || 0).toLocaleString('es-CO');
                
                tr.appendChild(tdSucursal);
                tr.appendChild(tdMonto);
                tableBody.appendChild(tr);
            });

            // Render Chart
            const ctx = document.getElementById('barChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sucursales,
                    datasets: [{
                        label: 'Monto Aprobado',
                        data: montos,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderColor: 'rgba(37, 99, 235, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return '$' + value.toLocaleString('es-CO'); }
                            }
                        }
                    }
                }
            });

        } else {
            document.getElementById('no-data').classList.remove('hidden');
        }
    </script>
</body>
</html>
